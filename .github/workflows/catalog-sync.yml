
name: Update official benefits snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '37 18 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch government benefits data
        env:
          GOV24_API_KEY: ${{ secrets.GOV24_API_KEY }}
        run: python scripts/sync.py

      - name: Commit updated data
        run: |
          git config user.name "bokji-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          git diff --cached --quiet || (git commit -m "Update public benefits catalog" && git push)
